name: Lint

on:
  push:
    branches: [main, stable, "feat/**"]
  pull_request:
    branches: [main, stable]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: shellcheck version
        run: shellcheck --version

      # Lint every shell script in the repo. .shellcheckrc at the root
      # controls severity (warning+) and project-wide disables.
      - name: Run shellcheck
        run: |
          set -e
          # Collect everything that looks like a shell script. Skip .git
          # and anything inside .github/workflows.
          mapfile -t files < <(
            find . \
              \( -path ./.git -o -path ./.github/workflows \) -prune \
              -o -type f \( -name '*.sh' -o -name '*.bash' \) -print
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found — nothing to lint."
            exit 0
          fi
          printf 'Linting %d files…\n' "${#files[@]}"
          # --severity=warning matches the .shellcheckrc default for
          # local runs. We pass it explicitly so the gate is the same
          # regardless of which shellcheck version GitHub's runner
          # ships — older versions ignore the rc-level setting.
          shellcheck --shell=bash --severity=warning "${files[@]}"

  bash-syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every shell file
        run: |
          set -e
          mapfile -t files < <(
            find . \( -path ./.git \) -prune -o -type f -name '*.sh' -print
          )
          for f in "${files[@]}"; do
            bash -n "$f"
            echo "ok  $f"
          done

  manifests:
    name: jq manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate every manifest.json
        run: |
          set -e
          mapfile -t files < <(find stacks -name manifest.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No manifests found."
            exit 0
          fi
          for f in "${files[@]}"; do
            jq -e . "$f" > /dev/null
            echo "ok  $f"
          done

  bento-managed-labels:
    name: BENTO_MANAGED labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PyYAML
        run: pip install --quiet --disable-pip-version-check pyyaml
      - name: Every service's deploy.labels declares BENTO_MANAGED labels
        run: |
          # Every SERVICE in every stacks/*/*/compose.yml must expose three
          # labels under deploy.labels so introspection tooling
          # (auth_propagate_state_providers in lib/auth-helpers.sh,
          # scripts/bento-auth list, future reconciliation logic) can find
          # bento-managed services via
          # `docker service ls --filter label=BENTO_MANAGED=true`.
          #
          # Without these labels the filter returns empty and the live-update
          # paths silently no-op even when bento stacks are running. See
          # GH-23 for the discovery trail.
          #
          # This check is per-SERVICE, not per-file: a file-level `grep` lets
          # one compliant service (e.g. a stack's webhook container) hide the
          # fact that a sibling service (e.g. its worker) has none of the
          # three labels at all — exactly how n8n_worker, chatwoot_sidekiq
          # and typebot_builder went unnoticed. PyYAML resolves `<<:` merge
          # keys, so an anchor shared across services is expanded before we
          # check each one individually.
          #
          # stacks/app/* support multiple instances on one host
          # ("<key>-<hex8>"); for those, BENTO_STACK_KEY must be the
          # *interpolated* form (`BENTO_STACK_KEY=${BENTO_STACK_KEY}`), not a
          # literal app name — that's how the runtime stack key (already
          # injected as an env var by stacks_build_env_payload) reaches the
          # Swarm service label future reconciliation tooling reads. A
          # literal value would make every instance report the base key.
          #
          # stacks/db/* and stacks/infra/* are singleton by design (shared
          # Postgres/Redis/Traefik/Portainer) and keep the literal
          # BENTO_STACK_KEY=<key> form.
          python3 <<'PYEOF'
          import glob, re, sys
          import yaml

          rc = 0
          for path in sorted(glob.glob("stacks/*/*/compose.yml")):
              key = path.split("/")[2]
              is_app = path.startswith("stacks/app/")
              expected_key_form = "${BENTO_STACK_KEY}" if is_app else key

              with open(path) as f:
                  data = yaml.safe_load(f)

              for name, svc in (data.get("services") or {}).items():
                  deploy = (svc or {}).get("deploy", {}) or {}
                  labels = deploy.get("labels", []) or []
                  if isinstance(labels, dict):
                      labels = [f"{k}={v}" for k, v in labels.items()]
                  joined = "\n".join(labels)

                  missing = []
                  if "BENTO_MANAGED=true" not in joined:
                      missing.append("BENTO_MANAGED=true")
                  if f"BENTO_STACK_KEY={expected_key_form}" not in joined:
                      missing.append(f"BENTO_STACK_KEY={expected_key_form}")
                  if not re.search(r"BENTO_DEPLOYED_REF=", joined):
                      missing.append("BENTO_DEPLOYED_REF=${BENTO_DEPLOYED_REF:-unknown}")

                  if missing:
                      print(f"::error file={path}::service '{name}' missing required deploy.labels: {', '.join(missing)}")
                      rc = 1
                  else:
                      print(f"ok  {path} :: {name}")

          sys.exit(rc)
          PYEOF

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate every compose.yml
        env:
          BASE_DOMAIN: example.test
          ADMIN_EMAIL: admin@example.test
          PORTAINER_HOST: portainer.example.test
          TRAEFIK_ACME_EMAIL: admin@example.test
        run: |
          set -e
          mapfile -t files < <(find stacks -name 'compose.yml')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No compose files found."
            exit 0
          fi
          # `docker compose config` chokes on undefined ${VARS}; export a
          # placeholder for every var that has no compose default
          # (`${VAR}`, `${VAR:?…}`). Vars written `${VAR:-x}` keep their
          # default: a placeholder there breaks typed fields such as
          # deploy.resources.limits.cpus ("placeholder" isn't a number).
          # We don't care about real values — just that the YAML parses
          # with substitutions applied.
          mapfile -t vars < <(grep -rhoE '\$\{[A-Z_][A-Z0-9_]*(\}|:\?)' stacks 2>/dev/null \
                              | sed -E 's/^\$\{//; s/(\}|:\?)$//' | sort -u)
          for v in "${vars[@]}"; do
            : "${!v:=placeholder}"
            export "$v"
          done
          for f in "${files[@]}"; do
            docker compose -f "$f" config > /dev/null
            echo "ok  $f"
          done
