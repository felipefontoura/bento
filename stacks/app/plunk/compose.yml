services:
  plunk:
    image: driaug/plunk:latest
    entrypoint: ["/app/entry.sh"]
    networks:
      - network_public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # =============================================================================
      # Public URLs / API
      # =============================================================================

      # Base application URI.
      - APP_URI=https://${PLUNK_HOST}

      # API endpoint URI.
      - API_URI=https://${PLUNK_HOST}/api

      # Public-facing API URI exposed to the frontend.
      - NEXT_PUBLIC_API_URI=https://${PLUNK_HOST}/api

      # =============================================================================
      # Database (PostgreSQL)
      # =============================================================================

      # Full database connection URL.
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${BENTO_STACK_KEY}

      # =============================================================================
      # Cache / Queue (Redis)
      # =============================================================================

      # Redis connection URL. Base instance stays on DB 2 (unchanged); extra
      # instances get a hashed DB in the 5-15 shared pool. Per-stack
      # allocation: 0 free / 1 n8n / 2 plunk / 3 chatwoot / 4 evolution-api
      # / 5-15 shared pool for extra instances of any of those four
      # (hash-based, collisions possible with enough concurrent instances
      # — acceptable v1 limitation, not a global allocator).
      - REDIS_URL=redis://redis:6379/${PLUNK_REDIS_DB}

      # =============================================================================
      # Security
      # =============================================================================

      # JWT signing secret. MUST remain stable across restarts/upgrades.
      - JWT_SECRET=${PLUNK_JWT_SECRET}

      # =============================================================================
      # Email (AWS SES)
      # =============================================================================

      # AWS region where SES is configured.
      - AWS_REGION=${AWS_REGION:-us-east-1}

      # AWS access key for SES.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}

      # AWS secret key for SES.
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

      # AWS SES configuration set name.
      - AWS_SES_CONFIGURATION_SET=${AWS_SES_CONFIGURATION_SET}

      # =============================================================================
      # Account Management
      # =============================================================================

      # Disable public signups.
      - DISABLE_SIGNUPS=true
    # Swarm healthcheck omitted — Traefik backend probe handles readiness.
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: "${PLUNK_CPU_LIMIT:-1}"
          memory: ${PLUNK_MEM_LIMIT:-512M}
      labels:
        - traefik.enable=true
        - traefik.http.routers.${BENTO_STACK_KEY}.rule=Host(`${PLUNK_HOST}`)
        - traefik.http.routers.${BENTO_STACK_KEY}.entrypoints=websecure
        - traefik.http.routers.${BENTO_STACK_KEY}.tls.certresolver=letsencryptresolver
        - traefik.http.routers.${BENTO_STACK_KEY}.priority=2
        - traefik.http.routers.${BENTO_STACK_KEY}.service=${BENTO_STACK_KEY}
        - traefik.http.services.${BENTO_STACK_KEY}.loadbalancer.server.port=3000
        - traefik.http.services.${BENTO_STACK_KEY}.loadbalancer.passHostHeader=true
        - BENTO_MANAGED=true
        - BENTO_STACK_KEY=${BENTO_STACK_KEY}
        - BENTO_DEPLOYED_REF=${BENTO_DEPLOYED_REF:-unknown}
networks:
  network_public:
    name: network_public
    external: true
